name: CI
on:
  push:
    branches:
      # Change this if your primary branch is not main
      - main
  pull_request:

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # This line enables distribution
      # The "--stop-agents-after" is optional, but allows idle agents to shut down once the "e2e-ci" targets have been requested
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      # legacy nx-plugin-openapi stays on Nx 19 devkit; its lint/test are excluded under the Nx 23 toolchain
      - run: npx nx affected -t lint --exclude=nx-plugin-openapi
      - run: npx nx affected -t test --exclude=nx-plugin-openapi
      - run: npx nx affected -t build
